# Contract: Topic study.
# Unknown frontmatter fields, the single-title rule, and roadmap_item matching the filename
# are enforced by `mise run lint:contracts`.
frontmatter:
  fields:
    - name: title
      type: string
    - name: roadmap_item
      type: string
    - name: status
      type: string
      enum: [draft, reviewed]
    - name: date
      type: date
      format: date
structure:
  - heading:
      pattern: "^# .+$"
      regex: true
    children:
      - heading: "## Summary"
        allow_additional: true
      - heading: "## Scope"
        allow_additional: true
      - heading: "## Findings"
        allow_additional: true
      - heading: "## Options and trade-offs"
        allow_additional: true
      - heading: "## Implications for Rustalgia"
        allow_additional: true
      - heading: "## Open questions"
        allow_additional: true
      - heading: "## Sources"
        allow_additional: true
