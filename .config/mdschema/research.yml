# Contract: Research note.
# Unknown frontmatter fields and the single-title rule are enforced by `mise run lint:contracts`.
frontmatter:
  fields:
    - name: title
      type: string
    - name: subject
      type: string
    - name: status
      type: string
      enum: [draft, reviewed]
    - name: date
      type: date
      format: date
structure:
  - heading:
      pattern: '^# .+$'
      regex: true
    children:
      - heading: '## Summary'
        allow_additional: true
      - heading: '## Scope'
        allow_additional: true
      - heading: '## What works well'
        allow_additional: true
      - heading: '## What works poorly'
        allow_additional: true
      - heading: '## Implications for Rustalgia'
        allow_additional: true
      - heading: '## Open questions'
        allow_additional: true
      - heading: '## Sources'
        allow_additional: true
