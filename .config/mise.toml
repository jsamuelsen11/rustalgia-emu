[tools]
rumdl = "latest"
lefthook = "latest"
lychee = "latest"
vale = "latest"
typos = "latest"
dprint = "latest"
actionlint = "latest"
zizmor = "latest"
pinact = "latest"
betterleaks = "latest"
committed = "latest"
"github:editorconfig-checker/editorconfig-checker" = "latest"
shellcheck = "latest"
shfmt = "latest"
"aqua:Latias94/merman" = "latest"
"aqua:jackchuka/mdschema" = "latest"

[tasks.fmt]
description = "Rewrite files with every formatter"
depends = ["fmt:rumdl", "fmt:dprint"]

[tasks."fmt:check"]
description = "Fail if any formatter would change a file"
depends = ["fmt:rumdl --check", "fmt:dprint --check"]
