[files]
extend-exclude = ["LICENSE", "*.lock"]
ignore-hidden = false

[default]
# Skip words made only of capitals and digits. They are acronyms, licence codes, and statute numbers, not prose.
extend-ignore-words-re = ["^[A-Z0-9]+$"]

[default.extend-words]
# Correctly spelled words that the checker takes for typos. Each maps to itself.
sav = "sav" # the file extension of a battery save
mata = "mata" # a party's name in Mata v Avianca
