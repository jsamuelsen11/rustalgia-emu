[files]
extend-exclude = ["LICENSE", "LICENSES/", "*.lock"]
ignore-hidden = false

[default]
# Skip words made only of capitals and digits. They are acronyms, licence codes, and statute numbers, not prose.
extend-ignore-words-re = ["^[A-Z0-9]+$"]

[default.extend-words]
# Correctly spelled words that the checker takes for typos. Each maps to itself.
sav = "sav" # the file extension of a battery save
mata = "mata" # a party's name in Mata v Avianca
Artic = "Artic" # Artic International, a party in Midway v Artic
Yout = "Yout" # Yout LLC, a party in Yout v RIAA
caf = "caf" # "cour d'appel fédérale", in the Federal Court of Appeal's host name
repositorys = "repositorys" # heading anchor of "repository's", as in #what-this-repositorys-controls-cover
flate = "flate" # part of flate2, a Rust compression crate
Noo = "Noo" # part of NooDS, a DS and Game Boy Advance emulator
ue = "ue" # the "UE" of Nestopia UE, an NES emulator, and its link labels
thar = "thar" # part of Thar0, a test author's handle, in repository names
damon = "damon" # part of DamonPS2, an Android PS2 emulator, and its link labels
Damon = "Damon" # the same name, capitalised
Virtua = "Virtua" # Sega's Virtua Striker and Virtua Fighter arcade games

[default.extend-identifiers]
# Correctly spelled words that the checker splits into wrong parts. Each maps to itself.
PDFing = "PDFing" # making PDF copies, in a quoted newsgroup post
ther4card = "ther4card" # a seller site's domain name, named by a Dutch court case
StikDebug = "StikDebug" # an iOS debugging tool, by its own name
