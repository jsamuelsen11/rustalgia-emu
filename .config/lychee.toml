# Internal links, heading anchors, and external URLs.
include_fragments = "anchor-only"
hidden = true
no_progress = true

# External requests.
cache = true
max_cache_age = "1d"
max_retries = 3
accept = ["200..=299", "429"]

# Hosts that refuse or time out on automated requests (tested 2026-11-20 on every address the research notes cite).
# Their links are kept for readers and not fetched here; a reviewer opens them by hand.
# docs/research/README.md, "Shape and links", says when a host belongs in this list.
exclude = [
  '^https?://(www\.)?problemkaputt\.de/', # 403 Forbidden
  '^https?://(www\.)?sec\.gov/', # 403 Forbidden (SEC's fair-access policy)
  '^https?://(www\.)?dolphin-emu\.org/', # 403 Forbidden
  '^https?://(www\.)?zilog\.com/', # 403 Forbidden after a redirect
  '^https?://support\.nintendo\.com/', # 403 Forbidden
  '^https?://(datacrystal\.)?tcrf\.net/', # 403 Forbidden
  '^https?://(www\.)?meti\.go\.jp/', # 403 Forbidden
  '^https?://(www\.)?siliconpr0n\.org/', # 403 Forbidden
  '^https?://(www\.)?consolemods\.org/', # 403 Forbidden
  '^https?://(www\.)?console5\.com/', # 403 Forbidden
  '^https?://archive\.dni\.gov/', # 403 Forbidden
  '^https?://(www\.)?psdevwiki\.com/', # 403 Forbidden (challenge page)
  '^https?://(www\.)?gnu\.org/', # times out
  '^https?://pascal\.computer\.org/', # search form; times out
  '^https?://(docs\.|www\.)?mamedev\.org/', # unreachable from automated checks
  # Refuse GitHub's CI runners though they answer other clients (CI runs of #34 to #46, 2026-11-20).
  '^https?://([a-z]+\.)?nesdev\.org/', # 403 to CI runners
  '^https?://n64brew\.dev/', # 403 to CI runners
  '^https?://image-ppubs\.uspto\.gov/', # 403 to CI runners
  '^https?://wiki\.neogeodev\.org/', # connection error from CI runners
  '^https?://docs\.vulkan\.org/', # 403 to CI runners
  '^https?://registry\.khronos\.org/', # 403 to CI runners
  '^https?://(www\.)?japaneselawtranslation\.go\.jp/', # 403 to CI runners
  '^https?://(www\.)?gesetze-im-internet\.de/', # times out from CI runners
  '^https?://(www\.)?rechtsprechung-im-internet\.de/', # times out from CI runners
  '^https?://emulation\.gametechwiki\.com/', # 403 to CI runners
  '^https?://doc\.dl\.playstation\.net/', # 403 to CI runners
  '^https?://(www\.)?romhacking\.net/', # 403 to CI runners
  '^https?://api\.github\.com/', # rate-limited for CI runners
  '^https?://(www\.)?no-intro\.org/', # times out from CI runners
  '^https?://elaw\.klri\.re\.kr/', # times out from CI runners
  '^https?://(www\.)?androidauthority\.com/', # 403 to CI runners
  '^https?://(www\.)?dragonminded\.com/', # times out from CI runners
  '^https?://(www\.)?nxp\.com/', # 404 to the link checker; serves its manuals to browsers
  '^https?://(www\.)?sega\.jp/', # 403 Forbidden (challenge page)
]
