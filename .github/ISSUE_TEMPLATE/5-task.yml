name: Task
description: A planned piece of work, such as research, a document, tooling, or a chore.
title: "task: "
labels: ["task"]
body:
  - type: textarea
    id: goal
    attributes:
      label: Goal
      description: What exists when this is done, and why it matters.
    validations:
      required: true
  - type: textarea
    id: scope
    attributes:
      label: Scope
      description: What is included, and what is deliberately left out.
  - type: textarea
    id: done
    attributes:
      label: Definition of done
      placeholder: |
        - [ ] ...
        - [ ] ...
    validations:
      required: true
  - type: input
    id: related
    attributes:
      label: Related roadmap items, requirements, or issues
      placeholder: "Roadmap: research phase, REQ-0003, #9"
