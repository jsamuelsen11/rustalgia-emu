name: Decision proposal
description: Raise an architecture or process decision that needs an ADR.
title: "decision: "
labels: ["decision", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Use this for choices that are hard to reverse or that shape other work.
        The outcome is recorded as an ADR in `docs/adr/`.
  - type: textarea
    id: question
    attributes:
      label: Decision needed
      description: The question to answer, in one or two sentences.
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Why this needs deciding now, and the constraints that apply.
    validations:
      required: true
  - type: textarea
    id: options
    attributes:
      label: Options
      description: Each option with its main benefit and its main cost.
    validations:
      required: true
  - type: textarea
    id: recommendation
    attributes:
      label: Recommendation
      description: The option you favour and why. Leave empty if you have none.
  - type: input
    id: blocked
    attributes:
      label: Work blocked by this decision
      placeholder: "REQ-0007, #18"
